# Portainer stack for the Pi. The docs site and the WebUI client stay on Vercel.
# A push to main publishes ghcr.io/thepotatogamer0/akira-bot:latest.

services:
  akira:
    image: ghcr.io/thepotatogamer0/akira-bot:latest
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/akira.db
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_DROP_CHANNEL_ID: ${DISCORD_DROP_CHANNEL_ID:-}
      AKIRA_PREFIX: ${AKIRA_PREFIX:-a}
      AKIRA_INTERNAL_PORT: "3847"
      AKIRA_INTERNAL_SECRET: ${AKIRA_INTERNAL_SECRET}
      BOT_INTERNAL_URL: http://127.0.0.1:3847
      SESSION_SECRET: ${SESSION_SECRET}
      WEBUI_ORIGINS: ${WEBUI_ORIGINS}
      WEBUI_SERVER_PORT: "3333"
    volumes:
      - akira-data:/data
      - akira-cards:/app/assets/cards

volumes:
  akira-data:
  akira-cards:
