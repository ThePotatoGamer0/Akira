<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Akira - WebUI</title>
    <meta name="application-name" content="Akira" />
    <meta name="apple-mobile-web-app-title" content="Akira" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f0c14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://media.discordapp.net" />
    <link rel="preconnect" href="https://cdn.discordapp.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        function paint(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f7f4fc" : "#0f0c14");
        }
        try {
          var k = "akira-webui-theme";
          var s = localStorage.getItem(k);
          var p = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var t = s === "dark" || s === "light" ? s : p ? "dark" : "light";
          paint(t);
        } catch (e) {}
        new MutationObserver(function () {
          var theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f7f4fc" : "#0f0c14");
        }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
