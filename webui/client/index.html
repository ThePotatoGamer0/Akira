<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Akira - WebUI</title>
    <meta name="application-name" content="Akira" />
    <meta name="apple-mobile-web-app-title" content="Akira" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f0c14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://media.discordapp.net" />
    <link rel="preconnect" href="https://cdn.discordapp.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
       * Paints the theme before the first React render, so there is no flash of
       * the wrong palette. Mirrors src/lib/theme.ts -- keep the two in step.
       */
      (function () {
        var k = "akira-webui-theme";
        // Mirrors PALETTES in src/lib/theme.ts. `page` is each --page in styles.css.
        var modes = { akira: "both", catppuccin: "both", discord: "dark", amoled: "dark", nord: "dark", dracula: "dark", solarized: "dark", paper: "light", crimson: "dark" };
        var pages = {
          akira: ["#f7f4fc", "#0f0c14"],
          catppuccin: ["#eff1f5", "#1e1e2e"],
          discord: ["#313338", "#313338"],
          amoled: ["#000000", "#000000"],
          nord: ["#2e3440", "#2e3440"],
          dracula: ["#282a36", "#282a36"],
          solarized: ["#002b36", "#002b36"],
          paper: ["#faf9f6", "#faf9f6"],
          crimson: ["#0b0606", "#0b0606"],
        };

        function paint(id, mode) {
          if (!modes[id]) {
            id = "akira";
            mode = null;
          }
          var dark = modes[id] === "dark" || (modes[id] === "both" && (mode || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark");
          document.documentElement.setAttribute("data-theme", id);
          document.documentElement.setAttribute("data-mode", dark ? "dark" : "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", pages[id][dark ? 1 : 0]);
        }

        function stored() {
          var raw = null;
          try {
            raw = localStorage.getItem(k);
          } catch (e) {}
          if (!raw) return ["akira", null];
          if (raw === "light" || raw === "dark") return ["akira", raw];
          var at = raw.indexOf(":");
          if (at < 0) return [raw, null];
          var mode = raw.slice(at + 1);
          return [raw.slice(0, at), mode === "light" || mode === "dark" ? mode : null];
        }

        var s = stored();
        try {
          paint(s[0], s[1]);
        } catch (e) {}
        /*
         * Deliberately no observer on the attributes above. A theme is applied by
         * this script once per load and never swapped on a live page: the settings
         * menu leaves and reloads instead. An earlier version watched
         * data-theme/data-mode and repainted on each change, which looped -- once an
         * observer with an attributeFilter is attached, it is notified of every
         * attribute on the element, and paint() writes two of them.
         */
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
